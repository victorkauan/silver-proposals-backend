name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # SAST: Semgrep (ERROR-level findings fail) and Bandit (high-severity findings fail).
      - name: Semgrep
        run: |
          uvx --from semgrep==1.183.0 semgrep scan --metrics=off --error --severity ERROR \
            --config p/python --config p/fastapi --config p/secrets src

      - name: Bandit
        run: uvx --from bandit==1.9.4 bandit -r src -q -lll

      # SCA: any known vulnerability in a runtime dependency fails.
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q > requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --disable-pip --no-deps

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose /repo

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: silver-proposals-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on CRITICAL vulnerabilities that have a fix; HIGH ones are reported in the log.
      - name: Trivy (image)
        env:
          IMAGE: silver-proposals-backend:${{ github.sha }}
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c "$@"
          }
          trivy image --quiet --ignore-unfixed --severity HIGH "$IMAGE"
          trivy image --quiet --ignore-unfixed --severity CRITICAL --exit-code 1 "$IMAGE"
